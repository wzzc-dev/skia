name: Build Skia Prebuilts For Skiko

on:
  push:
    branches:
      - skiko
      - skiko-m*
      - riscv64
      - moui-support
  pull_request:
  workflow_dispatch:
    inputs:
      milestone:
        description: 'Milestone version for manual runs (integer, for example: 146)'
        required: true
        type: number
      should_release:
        description: 'Run release related steps?'
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.mode.outputs.should_release }}
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: milestone
        shell: bash
        env:
          INPUT_MILESTONE: ${{ github.event.inputs.milestone || '' }}
        run: |
          if [[ "${GITHUB_REF_NAME}" == skiko-m* ]]; then
            echo "value=${GITHUB_REF_NAME#skiko-}" >> "$GITHUB_OUTPUT"
          elif [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            echo "value=m${INPUT_MILESTONE}" >> "$GITHUB_OUTPUT"
          else
            echo "value=dev" >> "$GITHUB_OUTPUT"
          fi
      - id: mode
        shell: bash
        env:
          INPUT_SHOULD_RELEASE: ${{ inputs.should_release || false }}
        run: |
          if [[ "$GITHUB_REF" == refs/heads/skiko-m* ]]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF" == refs/heads/riscv64 ]]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF" == refs/heads/moui-support ]]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$INPUT_SHOULD_RELEASE" == "true" ]]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          fi
      - id: version
        shell: bash
        run: |
          SHA="$(git rev-parse --short=10 "$GITHUB_SHA")"
          echo "value=${{ steps.milestone.outputs.value }}-${SHA}" >> "$GITHUB_OUTPUT"

  macos:
    needs: prepare
    if: false
    runs-on: ${{ fromJson('{"macos":"macos-15","ios":"macos-15","iosSim":"macos-15","tvos":"macos-15","tvosSim":"macos-15"}')[matrix.target] }}
    strategy:
      fail-fast: false
      matrix:
        target: ["macos", "ios", "iosSim", "tvos", "tvosSim"]
        machine: ["x64", "arm64"]
        build_type: [Release, Debug]
        library_type: [static, shared]
        exclude:
          - target: tvos
            machine: x64
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 tools/skia_release/check_release.py --skia-dir . --version ${{ needs.prepare.outputs.version }} --target ${{ matrix.target }} --build-type ${{ matrix.build_type }} --machine ${{ matrix.machine }} --library-type ${{ matrix.library_type }}
        if: ${{ needs.prepare.outputs.should_release == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Print Xcode version
        run: xcodebuild -version
      - run: python3 tools/skia_release/build.py --skia-dir . --build-type ${{ matrix.build_type }} --target ${{ matrix.target }} --machine ${{ matrix.machine }} --library-type ${{ matrix.library_type }} --gpu-as-extension --enable-graphite ${{ matrix.target == 'macos' && '--enable-graphite-dawn' || '' }}
      - run: python3 tools/skia_release/archive.py --skia-dir . --version ${{ needs.prepare.outputs.version }} --build-type ${{ matrix.build_type }} --target ${{ matrix.target }} --machine ${{ matrix.machine }} --library-type ${{ matrix.library_type }}
      - uses: actions/upload-artifact@v4
        if: ${{ needs.prepare.outputs.should_release == 'true' }}
        with:
          name: Skia-${{ needs.prepare.outputs.version }}-${{ matrix.target }}-${{ matrix.build_type }}-${{ matrix.machine }}${{ matrix.library_type == 'shared' && '-shared' || '' }}.zip
          path: '*.zip'
      - run: python3 tools/skia_release/release.py --skia-dir . --version ${{ needs.prepare.outputs.version }} --build-type ${{ matrix.build_type }} --target ${{ matrix.target }} --machine ${{ matrix.machine }} --library-type ${{ matrix.library_type }}
        if: ${{ needs.prepare.outputs.should_release == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  linux:
    needs: prepare
    if: false
    runs-on: ubuntu-latest
    container: ubuntu:20.04
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]
        library_type: [static, shared]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: ./tools/skia_release/prepare_linux.sh
      - run: python3 tools/skia_release/check_release.py --skia-dir . --version ${{ needs.prepare.outputs.version }} --build-type ${{ matrix.build_type }} --library-type ${{ matrix.library_type }}
        if: ${{ needs.prepare.outputs.should_release == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: PATH=/usr/lib/binutils-2.26/bin:$PATH python3 tools/skia_release/build.py --skia-dir . --build-type ${{ matrix.build_type }} --library-type ${{ matrix.library_type }} --gpu-as-extension --enable-graphite
      - run: PATH=/usr/lib/binutils-2.26/bin:$PATH python3 tools/skia_release/archive.py --skia-dir . --version ${{ needs.prepare.outputs.version }} --build-type ${{ matrix.build_type }} --library-type ${{ matrix.library_type }}
      - uses: actions/upload-artifact@v4
        if: ${{ needs.prepare.outputs.should_release == 'true' }}
        with:
          name: Skia-${{ needs.prepare.outputs.version }}-linux-${{ matrix.build_type }}-x64${{ matrix.library_type == 'shared' && '-shared' || '' }}.zip
          path: '*.zip'
      - run: python3 tools/skia_release/release.py --skia-dir . --version ${{ needs.prepare.outputs.version }} --build-type ${{ matrix.build_type }} --library-type ${{ matrix.library_type }}
        if: ${{ needs.prepare.outputs.should_release == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  linux-wasm:
    needs: prepare
    if: false
    runs-on: ubuntu-latest
    container: ubuntu:20.04
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]
        library_type: [static, shared]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: ./tools/skia_release/prepare_linux_wasm.sh
      - run: python3 tools/skia_release/check_release.py --skia-dir . --version ${{ needs.prepare.outputs.version }} --target wasm --build-type ${{ matrix.build_type }} --machine wasm --library-type ${{ matrix.library_type }}
        if: ${{ needs.prepare.outputs.should_release == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: python3 tools/skia_release/build.py --skia-dir . --target wasm --machine wasm --build-type ${{ matrix.build_type }} --library-type ${{ matrix.library_type }} --gpu-as-extension --enable-graphite-dawn
      - run: python3 tools/skia_release/archive.py --skia-dir . --version ${{ needs.prepare.outputs.version }} --target wasm --machine wasm --build-type ${{ matrix.build_type }} --library-type ${{ matrix.library_type }}
      - uses: actions/upload-artifact@v4
        if: ${{ needs.prepare.outputs.should_release == 'true' }}
        with:
          name: Skia-${{ needs.prepare.outputs.version }}-wasm-${{ matrix.build_type }}-wasm${{ matrix.library_type == 'shared' && '-shared' || '' }}.zip
          path: '*.zip'
      - run: python3 tools/skia_release/release.py --skia-dir . --version ${{ needs.prepare.outputs.version }} --target wasm --machine wasm --build-type ${{ matrix.build_type }} --library-type ${{ matrix.library_type }}
        if: ${{ needs.prepare.outputs.should_release == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  linux-android:
    needs: prepare
    if: false
    runs-on: ubuntu-latest
    container: ubuntu:20.04
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]
        machine: ["x64", "arm64"]
        library_type: [static, shared]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: ./tools/skia_release/prepare_linux.sh
      - run: python3 tools/skia_release/check_release.py --skia-dir . --version ${{ needs.prepare.outputs.version }} --target android --build-type ${{ matrix.build_type }} --machine ${{ matrix.machine }} --library-type ${{ matrix.library_type }}
        if: ${{ needs.prepare.outputs.should_release == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27d
      - run: python3 tools/skia_release/build.py --skia-dir . --target android --build-type ${{ matrix.build_type }} --machine ${{ matrix.machine }} --library-type ${{ matrix.library_type }} --ndk ${{ steps.setup-ndk.outputs.ndk-path }} --gpu-as-extension --enable-graphite
      - run: python3 tools/skia_release/archive.py --skia-dir . --version ${{ needs.prepare.outputs.version }} --target android --build-type ${{ matrix.build_type }} --machine ${{ matrix.machine }} --library-type ${{ matrix.library_type }}
      - uses: actions/upload-artifact@v4
        if: ${{ needs.prepare.outputs.should_release == 'true' }}
        with:
          name: Skia-${{ needs.prepare.outputs.version }}-android-${{ matrix.build_type }}-${{ matrix.machine }}${{ matrix.library_type == 'shared' && '-shared' || '' }}.zip
          path: '*.zip'
      - run: python3 tools/skia_release/release.py --skia-dir . --version ${{ needs.prepare.outputs.version }} --target android --build-type ${{ matrix.build_type }} --machine ${{ matrix.machine }} --library-type ${{ matrix.library_type }}
        if: ${{ needs.prepare.outputs.should_release == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  linux-harmonyos:
    needs: prepare
    if: ${{ github.ref_name != 'riscv64' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]
        machine: ["arm64"]
        library_type: [static, shared]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - uses: openharmony-rs/setup-ohos-sdk@v1.0.1
        id: setup-ohos-sdk
        with:
          version: '6.1'
          components: native
      - run: |
          python3 tools/skia_release/check_release.py \
            --skia-dir . \
            --version ${{ needs.prepare.outputs.version }} \
            --target harmonyos \
            --build-type ${{ matrix.build_type }} \
            --machine ${{ matrix.machine }} \
            --library-type ${{ matrix.library_type }}
        if: ${{ needs.prepare.outputs.should_release == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          python3 tools/skia_release/build.py \
            --skia-dir . \
            --target harmonyos \
            --build-type ${{ matrix.build_type }} \
            --machine ${{ matrix.machine }} \
            --library-type ${{ matrix.library_type }} \
            --ohos-sdk-native "${{ steps.setup-ohos-sdk.outputs.ohos_sdk_native }}" \
            --gpu-as-extension \
            --enable-graphite
      - run: |
          python3 tools/skia_release/archive.py \
            --skia-dir . \
            --version ${{ needs.prepare.outputs.version }} \
            --target harmonyos \
            --build-type ${{ matrix.build_type }} \
            --machine ${{ matrix.machine }} \
            --library-type ${{ matrix.library_type }}
      - uses: actions/upload-artifact@v4
        if: ${{ needs.prepare.outputs.should_release == 'true' }}
        with:
          name: Skia-${{ needs.prepare.outputs.version }}-harmonyos-${{ matrix.build_type }}-${{ matrix.machine }}${{ matrix.library_type == 'shared' && '-shared' || '' }}.zip
          path: '*.zip'
      - run: |
          python3 tools/skia_release/release.py \
            --skia-dir . \
            --version ${{ needs.prepare.outputs.version }} \
            --target harmonyos \
            --build-type ${{ matrix.build_type }} \
            --machine ${{ matrix.machine }} \
            --library-type ${{ matrix.library_type }}
        if: ${{ needs.prepare.outputs.should_release == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  linux-arm64:
    needs: prepare
    if: false
    runs-on: ubuntu-22.04-arm
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]
        library_type: [static, shared]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 tools/skia_release/check_release.py --skia-dir . --version ${{ needs.prepare.outputs.version }} --build-type ${{ matrix.build_type }} --target linux --machine arm64 --library-type ${{ matrix.library_type }}
        if: ${{ needs.prepare.outputs.should_release == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: addnab/docker-run-action@v3
        name: Assemble
        with:
          image: arm64v8/ubuntu:20.04
          options: -v ${{ github.workspace }}:/workspace -e BUILD_TYPE=${{ matrix.build_type }} -e LIBRARY_TYPE=${{ matrix.library_type }} -e BUILD_VERSION=${{ needs.prepare.outputs.version }} -e SKIA_BUILD_DIR=/workspace
          shell: /bin/bash
          run: |
            set -euo pipefail
            cd /workspace
            /bin/bash tools/skia_release/prepare_linux_arm.sh
            python3 tools/skia_release/build.py --skia-dir "${SKIA_BUILD_DIR}" --build-type "${BUILD_TYPE}" --target linux --machine arm64 --library-type "${LIBRARY_TYPE}" --gpu-as-extension --enable-graphite
            python3 tools/skia_release/archive.py --skia-dir "${SKIA_BUILD_DIR}" --version "${BUILD_VERSION}" --build-type "${BUILD_TYPE}" --target linux --machine arm64 --library-type "${LIBRARY_TYPE}"
      - uses: actions/upload-artifact@v4
        if: ${{ needs.prepare.outputs.should_release == 'true' }}
        with:
          name: Skia-${{ needs.prepare.outputs.version }}-linux-${{ matrix.build_type }}-arm64${{ matrix.library_type == 'shared' && '-shared' || '' }}.zip
          path: '*.zip'
      - run: python3 tools/skia_release/release.py --skia-dir . --version ${{ needs.prepare.outputs.version }} --build-type ${{ matrix.build_type }} --target linux --machine arm64 --library-type ${{ matrix.library_type }}
        if: ${{ needs.prepare.outputs.should_release == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  linux-riscv64:
    needs: prepare
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/heads/skiko-m') || github.ref_name == 'riscv64' || github.ref_name == 'moui-support' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]
        library_type: [static, shared]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 tools/skia_release/check_release.py --skia-dir . --version ${{ needs.prepare.outputs.version }} --build-type ${{ matrix.build_type }} --target linux --machine riscv64 --library-type ${{ matrix.library_type }}
        if: ${{ needs.prepare.outputs.should_release == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: riscv64
      - name: Free disk space
        run: |
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL
          docker system prune --all --force
          df -h
      - name: Assemble
        run: |
          docker run --rm --platform linux/riscv64 \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -e BUILD_TYPE="${{ matrix.build_type }}" \
            -e LIBRARY_TYPE="${{ matrix.library_type }}" \
            -e BUILD_VERSION="${{ needs.prepare.outputs.version }}" \
            -e SKIA_BUILD_DIR=/workspace \
            ubuntu:24.04 \
            /bin/bash -euxo pipefail -c '
              cd /workspace
              ./tools/skia_release/prepare_linux_riscv64.sh
              python3 tools/skia_release/build.py --skia-dir "${SKIA_BUILD_DIR}" --build-type "${BUILD_TYPE}" --target linux --machine riscv64 --library-type "${LIBRARY_TYPE}" --gpu-as-extension --enable-graphite
              python3 tools/skia_release/archive.py --skia-dir "${SKIA_BUILD_DIR}" --version "${BUILD_VERSION}" --build-type "${BUILD_TYPE}" --target linux --machine riscv64 --library-type "${LIBRARY_TYPE}"
            '
      - uses: actions/upload-artifact@v4
        if: ${{ needs.prepare.outputs.should_release == 'true' }}
        with:
          name: Skia-${{ needs.prepare.outputs.version }}-linux-${{ matrix.build_type }}-riscv64${{ matrix.library_type == 'shared' && '-shared' || '' }}.zip
          path: '*.zip'
      - run: python3 tools/skia_release/release.py --skia-dir . --version ${{ needs.prepare.outputs.version }} --build-type ${{ matrix.build_type }} --target linux --machine riscv64 --library-type ${{ matrix.library_type }}
        if: ${{ needs.prepare.outputs.should_release == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  windows:
    needs: prepare
    if: false
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]
        machine: ["x64", "arm64"]
        library_type: [static, shared]
    steps:
      - run: git config --global core.autocrlf input
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - shell: bash
        run: python3 tools/skia_release/check_release.py --skia-dir . --version ${{ needs.prepare.outputs.version }} --build-type ${{ matrix.build_type }} --target windows --machine ${{ matrix.machine }} --library-type ${{ matrix.library_type }}
        if: ${{ needs.prepare.outputs.should_release == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: microsoft/setup-msbuild@v1
      - uses: ilammy/msvc-dev-cmd@v1
      - shell: bash
        run: python3 tools/skia_release/build.py --skia-dir . --build-type ${{ matrix.build_type }} --target windows --machine ${{ matrix.machine }} --library-type ${{ matrix.library_type }} --gpu-as-extension --enable-graphite-dawn
      - shell: bash
        run: python3 tools/skia_release/archive.py --skia-dir . --version ${{ needs.prepare.outputs.version }} --build-type ${{ matrix.build_type }} --target windows --machine ${{ matrix.machine }} --library-type ${{ matrix.library_type }}
      - uses: actions/upload-artifact@v4
        if: ${{ needs.prepare.outputs.should_release == 'true' }}
        with:
          name: Skia-${{ needs.prepare.outputs.version }}-windows-${{ matrix.build_type }}-${{ matrix.machine }}${{ matrix.library_type == 'shared' && '-shared' || '' }}.zip
          path: '*.zip'
      - shell: bash
        run: python3 tools/skia_release/release.py --skia-dir . --version ${{ needs.prepare.outputs.version }} --build-type ${{ matrix.build_type }} --target windows --machine ${{ matrix.machine }} --library-type ${{ matrix.library_type }}
        if: ${{ needs.prepare.outputs.should_release == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
