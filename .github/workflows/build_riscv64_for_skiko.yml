name: Build Skia Prebuilts For Skiko (RISC-V64)

on:
  push:
    branches:
      - riscv64

permissions:
  contents: read

jobs:
  linux-riscv64:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: riscv64

      - id: version
        shell: bash
        run: |
          SHA="$(git rev-parse --short=10 "$GITHUB_SHA")"
          echo "value=dev-${SHA}" >> "$GITHUB_OUTPUT"

      - name: Build and archive in RISC-V64 container
        run: |
          docker run --rm --platform linux/riscv64 \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -e BUILD_TYPE="${{ matrix.build_type }}" \
            -e BUILD_VERSION="${{ steps.version.outputs.value }}" \
            -e SKIA_BUILD_DIR=/workspace \
            ubuntu:24.04 \
            /bin/bash -euxo pipefail -c '
              cd /workspace
              ./tools/skia_release/prepare_linux_riscv64.sh
              python3 tools/skia_release/build.py --skia-dir "${SKIA_BUILD_DIR}" --build-type "${BUILD_TYPE}" --target linux --machine riscv64 --gpu-as-extension --enable-graphite
              python3 tools/skia_release/archive.py --skia-dir "${SKIA_BUILD_DIR}" --version "${BUILD_VERSION}" --build-type "${BUILD_TYPE}" --target linux --machine riscv64
            '
